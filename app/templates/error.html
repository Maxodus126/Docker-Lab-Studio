<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }} · Docker Lab</title>
<style>
body{margin:0;background:#f5f8fc;color:#172b4d;font:15px/1.6 "Segoe UI",system-ui,sans-serif;display:grid;min-height:100vh;place-items:center;padding:24px}
main{max-width:520px;background:white;border:1px solid #e5ebf3;border-radius:20px;padding:34px;box-shadow:0 12px 35px #1b395d0d;text-align:center}
.icon{width:58px;height:58px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:#eef5ff;color:#2878f0;font-size:27px}
h1{font-size:24px;margin:0 0 8px}p{color:#718198;margin:0 0 20px}a{display:inline-block;background:#2878f0;color:white;text-decoration:none;padding:10px 16px;border-radius:10px;font-weight:700}
</style></head>
<body><main><div class="icon">↗</div><h1>{{ title }}</h1><p>{{ message }}</p><a href="/">Kembali ke aplikasi</a></main></body></html>
